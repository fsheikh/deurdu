<header class="banner-header">
    <!----
    <div class="favicon">
      <img src="{{ site.favicon }}" alt="Deurdu Favicon">
    </div>
-->
    <div class="site-header">
        <a href="{{ site.baseurl }}/" class="sitetitle-english">Dürdu</a>
        <span class="settitle-divider" aria-hidden="true">|</span>
        <a href="{{ site.baseurl }}/_ur/" class="sitetitle-urdu">ڈُردو</a>
    </div>
    {% include nav.html %}
    <div class = "header-content">
        <div class="header-actions">
            <div class="search">
                <input type="text" placeholder="Search">
            </div>
            <div class="login">
                <button>Login</button>
            </div>
            <div class="language-selector">
                <details>
                    <summary>
                        {% if page.lang == 'EN' or page.lang == nil %}EN
                        {% elsif page.lang == 'DE' %}DE
                        {% elsif page.lang == 'UR' %}UR{% endif %}
                    </summary>
                    <div class="language-options">
                        <a href="{{ site.baseurl }}/" class="lang-link">English (EN)</a>
                        <a href="{{ site.baseurl }}/_de/" class="lang-link">Deutsch (DE)</a>
                        <a href="{{ site.baseurl }}/_ur/" class="lang-link">اردو (UR)</a>
                    </div>
                </details>
        </div>
        </div>
    </div>
</header>
